<style>
  :root {
    --bg: #e4e8eb;
    --muted: #5a646d;
    --paper: #fffefb;
    --ink: #1c1c1c;
    --pink: #e59aab;
    --gold: #c8a45e;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15181b; --muted: #98a2ab; }
  }
  :root[data-theme="dark"] { --bg: #15181b; --muted: #98a2ab; }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%;
    background: var(--bg);
    font-family: var(--serif);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .hearts-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .h { display: inline-block; width: 1em; height: .92em; }
  .pink { color: var(--pink); }
  .gold { color: var(--gold); }

  /* ---------- Envelope stage ---------- */
  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2rem;
    transition: opacity .7s ease, visibility 0s linear .7s;
    padding: 24px;
  }
  body.reading .stage { opacity: 0; visibility: hidden; }

  .scene { perspective: 1000px; }
  .env {
    position: relative; display: block;
    width: min(88vw, 400px);
    aspect-ratio: 3 / 2;
    padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; color: inherit;
    transform-style: preserve-3d;
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.18));
  }
  .env:focus-visible { outline: 2px solid var(--pink); outline-offset: 8px; border-radius: 4px; }
  .env.wobble { animation: wobble .5s ease; }
  @keyframes wobble {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-2.2deg); }
    45% { transform: rotate(1.8deg); }
    70% { transform: rotate(-1deg); }
  }

  .env > * { position: absolute; display: block; }
  .env .back { inset: 0; background: #ebe8e2; border: 1px solid var(--ink); }
  .env .paper {
    left: 27%; width: 46%; top: 3%;
    z-index: 2;
    transition: transform 1.1s cubic-bezier(.3,.7,.2,1) .35s;
  }

  .env .pocket { inset: 0; z-index: 3; }
  .env .pocket svg, .env .flap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .env .pocket polygon, .env .pocket path, .env .flap polygon {
    vector-effect: non-scaling-stroke; stroke: var(--ink); stroke-width: 1px; stroke-linejoin: round;
  }
  .env .pocket polygon { fill: #fcfbf8; }
  .env .pocket path { fill: none; }

  .env .flap {
    left: 0; right: 0; top: 0; height: 55%;
    transform-origin: 50% 0;
    z-index: 4;
    transition: transform .8s cubic-bezier(.4,.1,.2,1), z-index 0s linear .3s;
  }
  .env .flap polygon { fill: #fcfbf8; transition: fill .4s ease .2s; }

  .env .hurra {
    left: 0; right: 0; bottom: 16%;
    text-align: center; z-index: 5;
    font-style: italic; font-weight: 400;
    font-size: clamp(2.3rem, 11vw, 3.1rem);
    letter-spacing: .01em; line-height: 1;
    transition: opacity .4s ease;
  }
  .env .seal {
    left: 50%; top: 55%; z-index: 6; width: 34px;
    transform: translate(-50%, -50%);
    font-size: 34px; line-height: 1; color: var(--pink);
    transition: opacity .3s ease;
  }
  .env .seal .h { width: 100%; height: .92em; display: block; }

  /* stage 1: flap lifts a little */
  .env.s1 .flap { transform: rotateX(34deg); }
  .env.s1 .seal { opacity: 0; }
  /* stage 2: fully open, card rises */
  .env.s2 .flap { transform: rotateX(180deg); z-index: 1; }
  .env.s2 .flap polygon { fill: #ebe8e2; }
  .env.s2 .seal, .env.s2 .hurra { opacity: 0; }
  .env.s2 .paper { transform: translateY(-62%); }

  .hint {
    margin: 0; font-style: italic; font-size: 1.3rem; color: var(--muted);
    min-height: 1.6em; transition: opacity .4s ease;
  }
  .hint.gone { opacity: 0; }

  /* ---------- Reader (the card) ---------- */
  .reader {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
    opacity: 0; visibility: hidden;
  }
  body.reading .reader { opacity: 1; visibility: visible; }
  body.reading { overflow: hidden; }

  .face {
    display: block; container-type: inline-size;
    background: #fbf3e2;
    box-shadow: 0 10px 24px rgba(0,0,0,.18);
  }
  .face img { display: block; width: 100%; height: auto; }
  .face .sign {
    display: block; margin: 0; padding: .6cqw 3cqw 5cqw; text-align: center;
    font-family: "Caveat", "Segoe Print", cursive; font-weight: 600;
    font-size: 6.3cqw; line-height: 1.2; color: #4b2e2a;
  }
  .face .sign .h { font-size: 4cqw; margin-left: .2em; vertical-align: -.1em; color: var(--pink); }
  .card { max-width: 480px; margin: 0 auto; transform-origin: 0 0; will-change: transform; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01s !important; transition-delay: 0s !important; animation-duration: .01s !important; }
  }
</style>

<script>
(function () {
  var env = document.getElementById('env');
  var hint = document.getElementById('hint');
  var card = document.getElementById('card');
  var paper = env.querySelector('.paper');
  var reader = document.getElementById('reader');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('miniImg').src = card.querySelector('img').src;
  var opened = false;

  function expand() {
    card.style.transition = 'none';
    card.style.transform = 'none';
    var to = card.getBoundingClientRect();
    var from = paper.getBoundingClientRect();
    var s = from.width / to.width;
    card.style.transform = 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) scale(' + s + ')';
    reader.scrollTop = 0;
    document.body.classList.add('reading');
    paper.style.visibility = 'hidden';
    void card.offsetWidth;
    if (!reduce) card.style.transition = 'transform 1.1s cubic-bezier(.3,.7,.2,1)';
    card.style.transform = 'none';
  }

  env.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    env.classList.add('s2');
    hint.classList.add('gone');
    setTimeout(expand, reduce ? 50 : 1650);
  });
})();
</script>
